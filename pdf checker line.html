<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDF/DOC Field Comparison</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background: linear-gradient(135deg, #f4f6f8 0%, #e8edf5 100%);
    padding: 20px;
    color: #333;
    max-width: 1200px;
    margin: 0 auto;
}
h2 { 
    text-align: center; 
    color: #2c3e50;
    margin-bottom: 25px;
    padding-bottom: 15px;
    border-bottom: 2px solid #3498db;
}
.upload-container {
    background: white;
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    margin-bottom: 25px;
}
.upload-section {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 20px;
}
.doc-box {
    flex: 1;
    min-width: 280px;
    padding: 20px;
    background: #f8fafc;
    border-radius: 8px;
    border: 2px dashed #cbd5e1;
    transition: all 0.3s ease;
}
.doc-box:hover {
    border-color: #3498db;
    background: #f1f8ff;
}
.doc-box h3 {
    margin-top: 0;
    color: #2c3e50;
    display: flex;
    align-items: center;
    gap: 10px;
}
.doc-box h3::before {
    content: "📄";
    font-size: 1.2em;
}
.file-input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: white;
    cursor: pointer;
}
.file-type {
    font-size: 0.9em;
    color: #666;
    margin: 5px 0 15px;
    font-style: italic;
}
.btn-compare {
    display: block;
    margin: 20px auto;
    padding: 12px 30px;
    background: linear-gradient(to right, #3498db, #2c80b9);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 6px rgba(50, 150, 250, 0.2);
}
.btn-compare:hover {
    background: linear-gradient(to right, #2980b9, #2573a7);
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(50, 150, 250, 0.3);
}
.btn-compare:active {
    transform: translateY(0);
}
.result-container {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    overflow-x: auto;
}
table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 8px;
    overflow: hidden;
}
th { 
    background: linear-gradient(to bottom, #2c3e50, #34495e);
    color: white;
    padding: 14px 10px;
    text-align: left;
    font-weight: 600;
}
td { 
    border: 1px solid #e1e8ed;
    padding: 12px 10px;
}
tr:nth-child(even) {
    background-color: #f8f9fa;
}
.match { 
    background: #d4edda; 
    border-left: 4px solid #28a745;
}
.mismatch { 
    background: #f8d7da; 
    border-left: 4px solid #dc3545;
}
.missing { 
    background: #fff3cd; 
    border-left: 4px solid #ffc107;
}
.status {
    font-weight: bold;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.85em;
}
.match .status { background: #28a745; color: white; }
.mismatch .status { background: #dc3545; color: white; }
.missing .status { background: #ffc107; color: #212529; }
.summary {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    padding: 15px;
    background: #f1f8ff;
    border-radius: 8px;
    font-weight: 600;
}
.loading {
    display: none;
    text-align: center;
    padding: 20px;
    color: #3498db;
}
.loading-spinner {
    border: 4px solid #f3f3f3;
    border-top: 4px solid #3498db;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 0 auto 15px;
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
@media (max-width: 768px) {
    .upload-section {
        flex-direction: column;
    }
    .doc-box {
        min-width: 100%;
    }
    table {
        font-size: 0.9em;
    }
}
</style>
</head>

<body>

<h2>📑 Field-Based Document Comparison (SI vs BL)</h2>

<div class="upload-container">
    <div class="upload-section">
        <div class="doc-box">
            <h3>Document 1 (BL Draft)</h3>
            <p class="file-type">Supports: PDF, DOC, DOCX</p>
            <input type="file" id="doc1" class="file-input" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
        </div>
        
        <div class="doc-box">
            <h3>Document 2 (SI)</h3>
            <p class="file-type">Supports: PDF, DOC, DOCX</p>
            <input type="file" id="doc2" class="file-input" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
        </div>
    </div>
    
    <button class="btn-compare" onclick="compareDocuments()">Compare Documents</button>
    
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <p>Processing documents... This may take a moment.</p>
    </div>
</div>

<div class="result-container" id="resultContainer" style="display:none;">
    <div class="summary" id="summary"></div>
    
    <table>
        <thead>
            <tr>
                <th>Field</th>
                <th>Document 1 (BL Draft)</th>
                <th>Document 2 (SI)</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="result"></tbody>
    </table>
</div>

<script>
async function extractTextFromFile(file) {
    const extension = file.name.split('.').pop().toLowerCase();
    
    if (extension === 'pdf') {
        return await extractTextFromPDF(file);
    } else if (extension === 'docx' || extension === 'doc') {
        return await extractTextFromDOC(file);
    } else {
        throw new Error('Unsupported file format');
    }
}

async function extractTextFromPDF(file) {
    const buffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument(buffer).promise;
    let text = "";
    
    for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        content.items.forEach(item => text += item.str + " ");
    }
    
    return text.replace(/\s+/g, " ").toUpperCase();
}

async function extractTextFromDOC(file) {
    try {
        // For DOCX files
        if (file.name.toLowerCase().endsWith('.docx')) {
            const arrayBuffer = await file.arrayBuffer();
            const result = await mammoth.extractRawText({arrayBuffer: arrayBuffer});
            return result.value.replace(/\s+/g, " ").toUpperCase();
        } 
        // For DOC files - fallback to reading as text
        else if (file.name.toLowerCase().endsWith('.doc')) {
            const reader = new FileReader();
            return new Promise((resolve, reject) => {
                reader.onload = function(e) {
                    resolve(e.target.result.replace(/\s+/g, " ").toUpperCase());
                };
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }
    } catch (error) {
        console.error("Error reading DOC file:", error);
        // Fallback: try reading as plain text
        return await file.text().then(text => text.replace(/\s+/g, " ").toUpperCase());
    }
}

function extractFields(text) {
    // More robust field extraction with multiple possible patterns
    return {
        shipper: extractField(text, ['SHIPPER', 'SHIPPER NAME', 'SHIPPER:']),
        consignee: extractField(text, ['CONSIGNEE', 'CONSIGNEE NAME', 'CONSIGNEE:']),
        notify: extractField(text, ['NOTIFY PARTY', 'NOTIFY', 'NOTIFY:']),
        booking: extractField(text, ['BOOKING NO', 'BOOKING NUMBER', 'BOOKING:', 'B/L NO', 'B/L NUMBER']),
        vessel: extractField(text, ['VESSEL', 'VESSEL NAME', 'VESSEL/VOYAGE']),
        pol: extractField(text, ['PORT OF LOADING', 'POL', 'LOAD PORT']),
        pod: extractField(text, ['PORT OF DISCHARGE', 'POD', 'DISCHARGE PORT']),
        container: extractField(text, ['CONTAINER NO', 'CONTAINER NUMBER', 'CONT. NO', 'TCNU']),
        weight: extractField(text, ['WEIGHT', 'GROSS WEIGHT', 'KGS', 'KG']),
        hs: extractField(text, ['HS CODE', 'H.S. CODE', 'HARMONIZED SYSTEM CODE'])
    };
}

function extractField(text, patterns) {
    for (const pattern of patterns) {
        // Try different regex patterns to capture field value
        const regex1 = new RegExp(`${pattern}\\s*[:\\-]?\\s*([A-Z0-9 ,.&\\-]+?)(?=\\s{2,}|\\n|$|\\s*[A-Z]{2,}:)`, 'i');
        const regex2 = new RegExp(`${pattern}\\s*[:\\-]?\\s*([^\\n]{1,80})`, 'i');
        
        const match1 = text.match(regex1);
        if (match1 && match1[1].trim()) {
            return match1[1].trim();
        }
        
        const match2 = text.match(regex2);
        if (match2 && match2[1].trim()) {
            return match2[1].trim();
        }
    }
    
    // Try to find container number with common pattern
    if (patterns.includes('CONTAINER NO') || patterns.includes('TCNU')) {
        const containerMatch = text.match(/TCNU\d+/i) || text.match(/[A-Z]{4}\d{7}/i);
        if (containerMatch) return containerMatch[0];
    }
    
    // Try to find weight with common pattern
    if (patterns.includes('WEIGHT') || patterns.includes('KGS')) {
        const weightMatch = text.match(/\d{1,3},?\d{3}\.?\d*\s*KGS/i) || 
                          text.match(/\d{1,3},?\d{3}\.?\d*\s*KG/i) ||
                          text.match(/\d{1,3},?\d{3}\.?\d*\s*KILO/i);
        if (weightMatch) return weightMatch[0];
    }
    
    // Try to find HS Code with common pattern
    if (patterns.includes('HS CODE')) {
        const hsMatch = text.match(/HS CODE\s*[:\\-]?\s*(\d{6,12})/i) || 
                       text.match(/(\d{6,12})\s*\(HS CODE\)/i);
        if (hsMatch) return hsMatch[1] || hsMatch[0];
    }
    
    return "";
}

async function compareDocuments() {
    const file1 = document.getElementById('doc1').files[0];
    const file2 = document.getElementById('doc2').files[0];
    
    if (!file1 || !file2) {
        alert('Please select both documents to compare.');
        return;
    }
    
    // Show loading indicator
    document.getElementById('loading').style.display = 'block';
    document.getElementById('resultContainer').style.display = 'none';
    
    try {
        // Extract text from both files
        const text1 = await extractTextFromFile(file1);
        const text2 = await extractTextFromFile(file2);
        
        // Extract fields from text
        const fields1 = extractFields(text1);
        const fields2 = extractFields(text2);
        
        // Display results
        displayComparison(fields1, fields2, file1.name, file2.name);
    } catch (error) {
        console.error('Error comparing documents:', error);
        alert('Error processing documents: ' + error.message);
    } finally {
        // Hide loading indicator
        document.getElementById('loading').style.display = 'none';
    }
}

function displayComparison(fields1, fields2, fileName1, fileName2) {
    const tbody = document.getElementById('result');
    tbody.innerHTML = '';
    
    let matchCount = 0;
    let mismatchCount = 0;
    let missingCount = 0;
    
    // Compare each field
    for (const field in fields1) {
        const value1 = fields1[field] || 'Not found';
        const value2 = fields2[field] || 'Not found';
        
        let status = 'MATCH';
        let cls = 'match';
        
        if (!value2 || value2 === 'Not found') {
            status = 'MISSING';
            cls = 'missing';
            missingCount++;
        } else if (value1 !== value2) {
            status = 'MISMATCH';
            cls = 'mismatch';
            mismatchCount++;
        } else {
            matchCount++;
        }
        
        tbody.innerHTML += `
        <tr class="${cls}">
            <td><strong>${field.toUpperCase()}</strong></td>
            <td>${value1}</td>
            <td>${value2}</td>
            <td><span class="status">${status}</span></td>
        </tr>`;
    }
    
    // Update summary
    const summary = document.getElementById('summary');
    summary.innerHTML = `
        <div>Document 1: <strong>${fileName1}</strong></div>
        <div>Document 2: <strong>${fileName2}</strong></div>
        <div>Matches: <span style="color:#28a745">${matchCount}</span> | 
             Mismatches: <span style="color:#dc3545">${mismatchCount}</span> | 
             Missing: <span style="color:#ffc107">${missingCount}</span></div>
    `;
    
    // Show results container
    document.getElementById('resultContainer').style.display = 'block';
}

// Allow drag and drop functionality
document.addEventListener('DOMContentLoaded', function() {
    const fileInputs = document.querySelectorAll('.file-input');
    
    fileInputs.forEach(input => {
        input.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.parentElement.style.borderColor = '#3498db';
            this.parentElement.style.backgroundColor = '#e8f4fc';
        });
        
        input.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.parentElement.style.borderColor = '#cbd5e1';
            this.parentElement.style.backgroundColor = '#f8fafc';
        });
        
        input.addEventListener('drop', function(e) {
            e.preventDefault();
            this.parentElement.style.borderColor = '#cbd5e1';
            this.parentElement.style.backgroundColor = '#f8fafc';
            
            if (e.dataTransfer.files.length) {
                this.files = e.dataTransfer.files;
                // Trigger change event
                const event = new Event('change', { bubbles: true });
                this.dispatchEvent(event);
            }
        });
    });
});
</script>

</body>
</html>
